plugins {
	id 'fabric-loom' version '1.9-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc:dev-launch-injector:0.2.1+build.8"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

tasks.register('exportRunCommand') {
	dependsOn classes, processResources
	doLast {
		def runTask = tasks.named('runClient', JavaExec).get()
		def cp = runTask.classpath.files.collect { it.absolutePath }.join(';')
		def lines = []
		lines << 'mainClass=' + runTask.mainClass.get()
		lines << 'classpath=' + cp
		lines << 'workingDir=' + runTask.workingDir.absolutePath
		lines << 'javaExec=' + (System.getProperty('java.home') + File.separator + 'bin' + File.separator + (org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'java.exe' : 'java'))
		lines << 'jvmArgs=' + ((runTask.jvmArgs ?: [])).join('||')
		lines << 'args=' + ((runTask.args ?: [])).join('||')
		file("${projectDir}/run-command.txt").text = lines.join('\n')
		println 'Run command exported to run-command.txt'
	}
}

tasks.register('packagePortable') {
	dependsOn exportRunCommand
	doLast {
		def gameDir = file("${projectDir}/realise/game")
		def libsDir = file("${gameDir}/libs")
		def runDir = file("${gameDir}/run")
		def classesDir = file("${gameDir}/classes")
		libsDir.mkdirs()
		runDir.mkdirs()
		classesDir.mkdirs()

		copy {
			from sourceSets.main.output
			into classesDir
		}

		if (file("${projectDir}/run/options.txt").exists())
			copy {
				from "${projectDir}/run/options.txt"
				into runDir
			}

		def lines = file("${projectDir}/run-command.txt").readLines()
		def out = []
		def libIndex = 0

		def loomDir = file("${gameDir}/loom")
		loomDir.mkdirs()
		def projectPrefix = projectDir.absolutePath
		def loomCachePrefix = projectPrefix + File.separator + '.gradle' + File.separator + 'loom-cache'

		def rewrite = { String text -> text.replace(loomCachePrefix, '{{BASE}}\\game\\loom')
				.replace(System.getProperty('user.home') + File.separator + '.gradle' + File.separator + 'caches' + File.separator + 'fabric-loom' + File.separator + 'assets', '{{BASE}}\\game\\assets') }

		copy { from "${projectDir}/.gradle/loom-cache/launch.cfg"; into loomDir; filter { line -> rewrite(line) } }
		copy { from "${projectDir}/.gradle/loom-cache/log4j.xml"; into loomDir }
		copy { from "${projectDir}/.gradle/loom-cache/remapClasspath.txt"; into loomDir; filter { line -> rewrite(line) } }

		for (String line : lines) {
			int idx = line.indexOf('=')
			if (idx <= 0) { out << line; continue }
			def key = line.substring(0, idx)
			def value = line.substring(idx + 1)

			if (key == 'classpath') {
				def entries = value.split(';').collect { entry ->
					def f = file(entry)
					if (f.directory) return 'CLASSES'
					def name = String.format('%04d', libIndex++)
					copy { from f; into libsDir; rename { name + '.jar' } }
					return 'LIB/' + name + '.jar'
				}
				value = entries.join(';')
			} else if (key == 'workingDir') {
				value = '{{BASE}}\\game\\run'
			} else if (key == 'javaExec') {
				value = '{{JAVA}}'
			} else if (key == 'args' || key == 'jvmArgs') {
				value = rewrite(value)
			}

			out << key + '=' + value
		}

		file("${gameDir}/run-command.txt").text = out.join('\n')
		println 'Portable package created in realise/game (' + libIndex + ' libs)'
	}
}